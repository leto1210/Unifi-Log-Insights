changelog:
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
        - perf
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI / build
      labels:
        - ci
        - build
    - title: Other
      labels:
        - "*"
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
